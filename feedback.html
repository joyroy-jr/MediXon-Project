<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Feedback — MediXon</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="background:var(--white2);">
<header>
  <a href="index.html" class="logo"><span class="logo-icon">⚕️</span> MediXon</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="feedback.html" class="active">Feedback</a>
    <a href="login.html">Login</a><a href="signup.html" class="nav-cta">Sign Up</a>
  </nav>
</header>
<div class="feedback-wrap">
  <h1 class="page-title">Share Your Feedback</h1>
  <div class="form-card" style="max-width:560px;margin:0 auto;">
    <p style="color:var(--text-d2);font-size:14px;margin-bottom:1.5rem;">Help us improve MediXon. Your feedback is greatly appreciated!</p>
    <form action="submitFeedback.php" method="post">
      <div class="form-group" style="margin-bottom:.9rem;"><label>Name</label><input type="text" name="name" placeholder="Write Name Here"></div>
      <div class="form-group" style="margin-bottom:.9rem;"><label>Email</label><input type="email" name="email" placeholder="Write Email Here"></div>
      <div class="form-group" style="margin-bottom:.9rem;">
        <label>Rating</label>
        <div class="star-row" id="starRow">
          <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
        </div>
        <input type="hidden" name="rating" id="ratingInput" value="5">
      </div>
      <div class="form-group" style="margin-bottom:1.1rem;"><label>Message</label><textarea name="message" placeholder="What do you like? What can we improve?" required style="min-height:110px;"></textarea></div>
      <button type="submit" class="btn btn-primary btn-full">Submit Feedback</button>
    </form>
  </div>
</div>
<footer>© 2026 MediXon </footer>
<script>
let rating=5;
const stars=document.querySelectorAll('.star');
function setStars(v){stars.forEach(s=>s.classList.toggle('active',parseInt(s.dataset.v)<=v));document.getElementById('ratingInput').value=v;}
setStars(5);
stars.forEach(s=>{
  s.addEventListener('click',()=>{rating=parseInt(s.dataset.v);setStars(rating);});
  s.addEventListener('mouseenter',()=>setStars(parseInt(s.dataset.v)));
});
document.getElementById('starRow').addEventListener('mouseleave',()=>setStars(rating));
</script>
</body>
</html>
