<div class="upload-form">
  <h1>🩺 Add Equipment</h1>
  <div class="form-card">
    <form action="UploadEquipmentServlet.php" method="post" enctype="multipart/form-data">
      <div class="form-grid">
        <div class="form-group"><label>Equipment Name</label><input type="text" name="name" placeholder="Name" required></div>
        <div class="form-group">
          <label>Category </label>
          <select name="category" required>
            <option value="">Select category</option>
            <option>Mobility Aids</option><option>Hospital Beds</option><option>Respiratory</option>
            <option>Monitoring</option><option>Rehabilitation</option><option>Daily Living Aids</option><option>Other</option>
          </select>
        </div>
        <div class="form-group"><label>Brand / Company</label><input type="text" name="company" placeholder="Brand name"></div>
        <div class="form-group"><label>Quantity</label><input type="number" name="quantity" placeholder="1" min="1" value="1" required></div>
        <div class="form-group">
          <label>Condition </label>
          <select name="condition" required><option value="New">New</option><option value="Used">Used</option></select>
        </div>
        <div class="form-group">
          <label>Mode </label>
          <select name="mode" id="modeSelect" required onchange="togglePriceFields()">
            <option value="Donate">Donate (Free)</option>
            <option value="Swap">Swap</option>
            <option value="Rent">Rent</option>
            <option value="Low Price Sale">Low Price Sale</option>
          </select>
        </div>
        <div class="form-group" id="priceGroup" style="display:none;"><label>Price (BDT)</label><input type="number" name="price" placeholder="0.00" step="0.01" min="0"></div>
        <div class="form-group" id="rentGroup" style="display:none;"><label>Rent per Day (BDT)</label><input type="number" name="rent_per_day" placeholder="0.00" step="0.01" min="0"></div>
        <div class="form-group"><label>Location </label><input type="text" name="location" placeholder="City, Area" required></div>
        <div class="form-group"><label>Purchase / Expiry Date</label><input type="date" name="expiry"></div>
        <div class="form-group full"><label>Description</label><textarea name="description" placeholder="Describe the equipment condition, accessories included, usage history."></textarea></div>
        <div class="form-group full"><label>Photo (optional)</label><input type="file" name="photo" accept="image/*" onchange="previewImg(this,'prevImg')">
          <img id="prevImg" style="display:none;margin-top:.6rem;max-height:160px;border-radius:8px;object-fit:cover;"></div>
      </div>
      <button class="btn btn-primary btn-full" type="submit" style="margin-top:1.25rem;">Upload Equipment</button>
    </form>
  </div>
</div>
<footer>© 2026 MediXon </footer>
<script>
function togglePriceFields(){
  const m=document.getElementById('modeSelect').value;
  document.getElementById('priceGroup').style.display=m==='Low Price Sale'?'':'none';
  document.getElementById('rentGroup').style.display=m==='Rent'?'':'none';
}
function previewImg(input,id){
  const el=document.getElementById(id);
  if(input.files&&input.files[0]){const r=new FileReader();r.onload=e=>{el.src=e.target.result;el.style.display='block';};r.readAsDataURL(input.files[0]);}
}
togglePriceFields();
</script>
</body>
</html>
