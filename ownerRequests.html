  <div class="dash-tabs">
    <button class="dash-tab active" onclick="switchOwnerTab('equipment',this)">🩺 Equipment Requests</button>
    <button class="dash-tab" onclick="switchOwnerTab('medicine',this)">💊 Medicine Requests</button>
  </div>
  <div id="owner-equipment">
    <div class="equipment-list" id="ownerEquipRequestsList"><div class="empty-state"><p>Loading...</p></div></div>
  </div>
  <div id="owner-medicine" style="display:none;">
    <div class="equipment-list" id="ownerMedRequestsList"><div class="empty-state"><p>Loading...</p></div></div>
  </div>
</div>
<footer>© 2026 MediXon </footer>
<script src="ownerRequestsScripts.js"></script>
<script>
function switchOwnerTab(tab,el){
  document.querySelectorAll('.dash-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('owner-equipment').style.display=tab==='equipment'?'':'none';
  document.getElementById('owner-medicine').style.display=tab==='medicine'?'':'none';
  if(tab==='medicine') loadOwnerMedicineRequests();
}
</script>
